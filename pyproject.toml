[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-ml"
version = "0.1.0"
description = "Reproducible four-class brain MRI tumor classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "kagglehub>=0.3,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.4,<1"]

[project.scripts]
brain-tumor-train = "brain_tumor_ml.train:main"
brain-tumor-experiment = "brain_tumor_ml.experiment:main"
brain-tumor-demo-data = "brain_tumor_ml.demo_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
